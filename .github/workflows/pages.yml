# The information site of Krizaka Agents (site/): lint, tests (the publication checks included), the static build and its browser
# check on every pull request and in the merge queue; on main the same build is published to GitHub Pages by the shared workflow
# (krizaka-internal#3122, #4149). The custom domain agents.krizaka.com is set: the site is served at the root, so the build has no base path (SITE_BASE_PATH unset).
# The founder's name is checked apart, in « Founder name guard »: the only job that receives the keyed secret FOUNDER_NAME_GUARD
# (krizaka-restricted#375). It fails closed without the secret except on a fork's pull request, and the site is published only
# after it passed.
name: Pages site

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  founder-name:
    name: Founder name guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # The secret reaches this step only. Required (fails closed without it) everywhere but on a fork's pull request.
      - name: No page names the founder (keyed HMAC)
        env:
          FOUNDER_NAME_GUARD: ${{ secrets.FOUNDER_NAME_GUARD }}
          FOUNDER_NAME_GUARD_REQUIRED: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: node --test tests/public-no-founder-name.test.mjs

  # The architecture views (site/lib/architecture.json) were laid out from krizaka/.github's model as it is on its main: the model,
  # the org base and the French words, compared by sha256 (krizaka-internal#4184). Red when the model moved: lay it out again with
  # `node scripts/architecture.mjs layout <krizaka/.github checkout>`.
  architecture:
    name: Architecture views
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/.github
          ref: main
          path: org-model
          persist-credentials: false
          sparse-checkout: docs/architecture
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The CLI is a tool of this check only, pinned here like playwright below (bundle-require: a module LikeC4's config loads)
      - run: npm install --ignore-scripts --no-save --no-audit --no-fund @krizaka/architecture@0.4.0 bundle-require@5.1.0
      - run: node scripts/architecture.mjs check ../org-model
      # The 1.0 draft's views (site/lib/release-architecture.json): the copied krizaka-agents model and the site's views, on the
      # same org base; red when one moved: `node scripts/release-architecture.mjs layout <krizaka/.github checkout>`.
      - run: node scripts/release-architecture.mjs check ../org-model

  site:
    name: Static site
    needs: founder-name
    uses: krizaka/.github/.github/workflows/pages-site.yml@1a355396d57377d16274ec3f10cc83aa0ccf3d0c # main
    permissions:
      contents: read
      pages: write # deploys to GitHub Pages
      id-token: write # OIDC token the deployment or publish needs
    with:
      working-directory: site
      output-dir: site/out
      timeout-minutes: 20
      test-command: |
        npm run lint
        npm test
      # The build, then what needs the built site: the publication and decided-words checks (skipped by `npm test`, which runs before any build) on every built file, every org link answering 200
      # without a token, and no horizontal overflow
      # (360 to 1440 px, both languages, both themes).
      build-command: |
        npm run build
        node --test tests/publication.test.mjs tests/words-and-contact.test.mjs tests/no-base-path.test.mjs
        node scripts/check-links.mjs
        mkdir -p "$RUNNER_TEMP/srv"
        if [ -n "${SITE_BASE_PATH:-}" ]; then ln -sfn "$PWD/out" "$RUNNER_TEMP/srv/${SITE_BASE_PATH#/}"; else cp -R "$PWD/out/." "$RUNNER_TEMP/srv/"; fi
        python3 -m http.server 3100 --directory "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
        server=$!
        trap 'kill "$server" 2>/dev/null || true' EXIT
        sleep 2
        npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.64.1
        node_modules/.bin/playwright install --with-deps chromium
        node scripts/check-overflow.mjs --base "http://localhost:3100${SITE_BASE_PATH:-}"
      expect-files: |
        index.html
        fr/index.html
        404.html
        sitemap.xml
        flow/index.html
        fr/flow/index.html
        rules/index.html
        fr/rules/index.html
        alerts/index.html
        fr/alerts/index.html
        cockpit/index.html
        fr/cockpit/index.html
        proofs/index.html
        fr/proofs/index.html
